[package]
name = "tacto-connect"
version = "1.2.0"
edition = "2024"

[dependencies]
tokio = "1.48"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
webrtc = "0.14"
global-hotkey = { version = "0.7", features = ["serde"] }
eframe = "0.33"
reqwest = { version = "0.12", features = ["blocking"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
qrcode = "0.14"
futures = "0.3"
serde = "1.0"
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
simplelog = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[profile.release]
strip = true
lto = true
panic = "abort"
